<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crave Cart – Online Food Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{--bg:#080303;--card:rgba(26,8,8,.8);--text:#fff1ec;--muted:#c9a8a0;--line:#4d1a15;--accent:#e01b1b;--onaccent:#fff;--chili:#ff5a4a;--ok:#2bd67b;--cyan:#ff9a3c;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px}
.logo{font-weight:800;font-size:1.3rem;cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.tab{background:none;border:0;padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--text);color:var(--bg)}
.btn{background:var(--accent);color:var(--onaccent);border:0;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--text)}
.btn.bad{background:none;border:1px solid var(--chili);color:var(--chili)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0 0 8px;font-weight:800}
h2{font-size:1.4rem;margin:28px 0 12px}
.hero{background:var(--text);color:var(--bg);border-radius:20px;padding:28px 24px;margin-bottom:8px}
.hero p{max-width:50ch;margin:0 0 14px;opacity:.85}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.emoji{font-size:3rem;line-height:1}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px}
.price{font-weight:800}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--line)}
.s-Delivered{background:var(--ok);color:#fff}.s-Cancelled{background:var(--chili);color:#fff}.s-Placed,.s-Preparing,.s-Out{background:var(--accent);color:var(--onaccent)}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ok)}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.two{display:grid;gap:20px;grid-template-columns:1fr}@media(min-width:800px){.two{grid-template-columns:1.4fr 1fr}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;display:none}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
.neon{--bg:#07060f;--card:rgba(20,14,42,.72);--text:#f4f1ff;--muted:#a79fd0;--line:#3b2a80;--accent:#ff2bd6;--onaccent:#07060f;--chili:#ff4d6d;--ok:#39ff88;--cy:#00f0ff;color-scheme:dark}
#fx,#fx2{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:-1}#fx2{z-index:30}
.neon header{backdrop-filter:blur(10px);border-bottom-color:var(--accent);box-shadow:0 1px 18px rgba(255,43,214,.35)}
.neon .logo{color:var(--cy)}
.neon .logo,.neon h1,.neon h2{text-shadow:0 0 10px rgba(0,240,255,.7)}
.neon .hero{background:linear-gradient(135deg,rgba(80,20,160,.75),rgba(0,70,140,.75));color:#fff;border:1px solid var(--accent);box-shadow:0 0 24px rgba(255,43,214,.45),inset 0 0 24px rgba(0,240,255,.15)}
.neon .card{backdrop-filter:blur(6px)}
.neon .card:hover{border-color:var(--cy);box-shadow:0 0 16px rgba(0,240,255,.35)}
.neon .btn{box-shadow:0 0 12px rgba(255,43,214,.7)}
.neon .btn.alt{box-shadow:none;border-color:var(--cy);color:var(--cy)}
.neon .btn.bad{box-shadow:none}
.neon .chip.on{box-shadow:0 0 12px var(--accent)}
.neon .tab.on{background:transparent;color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 12px var(--cy)}
.neon input:focus,.neon select:focus,.neon textarea:focus{border-color:var(--cy);box-shadow:0 0 10px var(--cy)}
.neon .price{color:var(--cy);text-shadow:0 0 8px rgba(0,240,255,.6)}
.neon .badge{background:#2a1f5c}
.neon .badge.s-Delivered{background:var(--ok);color:#07060f}
.neon .badge.s-Cancelled{background:var(--chili);color:#07060f}
.neon .badge.s-Placed,.neon .badge.s-Preparing,.neon .badge.s-Out{background:var(--accent);color:#07060f}
.neon .steps i.on{box-shadow:0 0 8px var(--ok)}
.neon select option{background:#14102a;color:#f4f1ff}
body{background:radial-gradient(circle at 15% 0,#2d0f52 0,transparent 45%),radial-gradient(circle at 90% 100%,#06323f 0,transparent 45%),var(--bg)}
header{backdrop-filter:blur(10px)}
main{position:relative;z-index:1}
.logo{font-family:Italiana,"Bricolage Grotesque",Georgia,serif;font-weight:400;font-size:2.1rem;letter-spacing:.05em;color:#fff;text-shadow:0 0 6px var(--accent),0 0 18px var(--accent),0 0 38px var(--cyan)}
h1,h2{font-family:Italiana,"Bricolage Grotesque",Georgia,serif;font-weight:400;text-shadow:0 0 14px rgba(255,43,214,.55)}
h1{font-size:clamp(2.4rem,7vw,4rem)}
.card{backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,43,214,.12),0 0 18px rgba(24,240,255,.07)}
.card:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(24,240,255,.45)}
.btn{box-shadow:0 0 12px var(--accent);color:#fff}
.btn.alt,.btn.bad{box-shadow:none}
.hero{background:linear-gradient(135deg,rgba(255,43,214,.28),rgba(24,240,255,.18));border:1px solid var(--accent);color:var(--text);box-shadow:0 0 32px rgba(255,43,214,.35)}
.tab.on{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent)}
.price{color:var(--cyan);text-shadow:0 0 8px rgba(24,240,255,.6)}
.chip.on{color:#fff;box-shadow:0 0 12px var(--accent)}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
select option{background:#140c28;color:#f4eeff}
.dot{display:inline-block;width:12px;height:12px;border:2px solid;border-radius:3px;position:relative;vertical-align:-1px;margin-right:6px}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.v{color:#2bffb0}.dot.n{color:#ff4d6d}
#fx,#cur{position:fixed;inset:0;pointer-events:none}#fx{z-index:0}#cur{z-index:30}
body{background:radial-gradient(circle at 15% 0,#3a0808 0,transparent 45%),radial-gradient(circle at 90% 100%,#4a1300 0,transparent 45%),var(--bg)}
h1,h2{text-shadow:0 0 14px rgba(255,60,20,.55)}
.card{box-shadow:0 0 0 1px rgba(224,27,27,.2),0 0 18px rgba(255,100,20,.08)}
.card:hover{box-shadow:0 0 18px rgba(255,120,30,.5)}
.hero{background:linear-gradient(135deg,rgba(224,27,27,.38),rgba(255,140,30,.18));box-shadow:0 0 32px rgba(224,27,27,.4)}
.price{text-shadow:0 0 8px rgba(255,140,30,.6)}
select option{background:#1a0707;color:#fff1ec}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 2px var(--accent),0 0 16px var(--accent)}
#fire{position:fixed;inset:0;pointer-events:none;z-index:0}
.logo img{width:auto;height:46px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 0 0 2px var(--accent),0 0 16px var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
</style>
</head>

  '<p>We generated an OTP for +91 '+esc(S.ph)+'.</p><div class="card" style="text-align:center;margin:8px 0">Demo OTP: <b class="price" style="font-size:1.5rem;letter-spacing:.2em">'+S.otp+'</b><div class="muted">A live site would send this by SMS.</div></div><label for="ot">Enter the 6-digit OTP</label><input id="ot" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><p><button class="btn" style="width:100%" onclick="verifyOtp()">Verify and login</button></p><button class="btn alt" onclick="S.otp=\'\';render()">Change number</button>':
  '<label for="nm">Full name</label><input id="nm" autocomplete="name" value="'+esc(S.nm)+'"><label for="ph">Mobile number</label><div class="row" style="flex-wrap:nowrap"><span class="badge">+91</span><input id="ph" inputmode="tel" maxlength="10" placeholder="10-digit mobile number" value="'+esc(S.ph)+'"></div><p><button class="btn" style="width:100%" onclick="sendOtp()">Send OTP</button></p>')+'</div>'}
function sendOtp(){var n=$("nm").value.trim(),p=$("ph").value.replace(/\s/g,"");
  if(n.length<2)return toast("Enter your name");
  if(!/^[6-9]\d{9}$/.test(p))return toast("Enter a valid 10-digit mobile number");
  S.nm=n;S.ph=p;S.otp=String(100000+Math.floor(Math.random()*900000));render()}
function verifyOtp(){if($("ot").value.trim()!==S.otp)return toast("That OTP is not correct");
  S.user={name:S.nm,phone:S.ph};sv("user",S.user);S.otp="";toast("Logged in");go(S.cart.length?"checkout":"home")}
function menuPage(){
  var op=isOpen();
  return '<div class="hero"><h1>Hungry in Nellore?</h1><p>Pick a restaurant to open its own menu. Delivery across Nellore, every day '+HRS+'.</p><span class="badge" style="background:'+(op?"var(--ok)":"var(--chili)")+';color:#fff">'+(op?"Open now":"Closed now · opens 8:00 AM")+'</span></div><h2>Restaurants in Nellore</h2><div class="grid">'+
  RESTS.map(function(r,i){var n=S.foods.filter(function(f){return f.r===i}).length;return '<div class="card"><b>'+r.n+'</b><div class="muted">📍 '+r.a+'</div><div class="muted">'+r.t+'</div><div class="muted">⭐ '+r.r+' · '+r.m+' min · 🕗 '+HRS+'</div><div style="margin:8px 0"><span class="badge">'+r.o+'</span> <span class="badge">'+n+' items</span></div><button class="btn" onclick="openRest('+i+')">Open menu</button></div>'}).join("")+'</div>'}
function openRest(i){S.rid=i;S.q="";S.cat="All";S.diet="all";go("rest")}
function restPage(){
  var r=RESTS[S.rid],op=isOpen(),all=S.foods.filter(function(f){return f.r===S.rid}),
  cats=["All"].concat(all.map(function(f){return f.c}).filter(function(c,i,a){return a.indexOf(c)===i})),
  list=all.filter(function(f){return(S.diet==="all"||(S.diet==="veg")===!!f.v)&&(S.cat==="All"||f.c===S.cat)&&f.n.toLowerCase().indexOf(S.q.toLowerCase())>-1});
  return '<button class="btn alt" onclick="go(\'home\')">← All restaurants</button><h2 style="margin-top:14px">'+r.n+'</h2><div class="muted">📍 '+r.a+' · ⭐ '+r.r+' · '+r.m+' min · 🕗 '+HRS+'</div><p><span class="badge" style="background:'+(op?"var(--ok)":"var(--chili)")+';color:#fff">'+(op?"Open now":"Closed · opens 8:00 AM")+'</span> <span class="badge">'+r.o+'</span></p>'+
  '<div class="row" style="margin-bottom:12px"><input id="q" style="max-width:320px" placeholder="Search this menu" value="'+esc(S.q)+'" oninput="S.q=this.value;keep()" aria-label="Search this menu"></div>'+
  '<div class="row" style="margin-bottom:10px">'+[["all","All food"],["veg","Veg"],["non","Non-veg"]].map(function(d){return '<button class="chip'+(S.diet===d[0]?" on":"")+'" onclick="S.diet=\''+d[0]+'\';render()">'+(d[0]==="all"?"":'<span class="dot '+(d[0]==="veg"?"v":"n")+'"></span>')+d[1]+'</button>'}).join("")+'</div>'+
  '<div class="row" style="margin-bottom:14px">'+cats.map(function(c){return '<button class="chip'+(S.cat===c?" on":"")+'" onclick="S.cat=\''+c+'\';render()">'+c+'</button>'}).join("")+'</div>'+
  (list.length?'<div class="grid">'+list.map(function(f){return '<div class="card"><div class="emoji">'+f.e+'</div><b><span class="dot '+(f.v?"v":"n")+'"></span>'+esc(f.n)+'</b><div class="muted">'+esc(f.c)+'</div><div class="row sp" style="margin-top:10px"><span class="price">'+money(f.p)+'</span><button class="btn"'+(op?"":" disabled")+' onclick="add('+f.id+')">'+(op?"Add":"Closed")+'</button></div></div>'}).join("")+'</div>':'<p class="muted">No dishes match. Clear the search or pick another filter.</p>')}
function add(id){if(!isOpen())return toast("Restaurants are open "+HRS);var f=S.foods.find(function(x){return x.id===id}),i=S.cart.find(function(x){return x.id===id});if(i)i.q++;else S.cart.push({id:id,n:f.n,p:f.p,e:f.e,q:1});nav();toast(f.n+" added to cart")}
function checkout(){
  if(!S.cart.length)return cart();
  if(!S.user)return '<h2>Log in to place your order</h2><p class="muted">Your cart is saved while you log in with an OTP.</p><button class="btn" onclick="go(\'login\')">Login</button>';
  return '<h2>Checkout</h2><div class="two"><div class="card"><label for="ad">Delivery address in Nellore</label><textarea id="ad" rows="3" placeholder="House no, street, area, Nellore"></textarea><p class="muted">Delivery contact: +91 '+esc(S.user.phone)+'</p><label for="pm">Payment method</label><select id="pm">'+["Cash on delivery","UPI","Credit / debit card"].map(function(m){return '<option>'+m+'</option>'}).join("")+'</select><p class="muted">Online payments are simulated in this demo.</p></div><div>'+summary()+'<p><button class="btn" style="width:100%" onclick="place()">Place order</button></p></div></div>'}
function place(){
  var a=$("ad").value.trim(),m=$("pm").value;
  if(a.length<8)return toast("Enter a full delivery address");
  if(!isOpen())return toast("Restaurants are closed. Open "+HRS);
  var rs=S.cart.map(function(i){return RESTS[S.foods.find(function(f){return f.id===i.id}).r].n}).filter(function(x,i,z){return z.indexOf(x)===i});
  var o={id:"CC"+(1000+S.orders.length+1),user:S.user.phone,name:S.user.name,items:S.cart.map(function(i){return{n:i.n,p:i.p,q:i.q}}),total:total(),addr:a,phone:S.user.phone,pay:m,payStatus:m==="Cash on delivery"?"Pending":"Paid",status:"Placed",ts:Date.now(),rest:rs.join(", "),dp:DB[S.orders.length%DB.length],time:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"})};
  S.orders.unshift(o);sv("orders",S.orders);S.cart=[];S.coupon="";S.msg=o.id;go("done")}
function st(o){if(o.status==="Cancelled")return "Cancelled";if(!o.ts)return o.status;var e=(Date.now()-o.ts)/1000;return e<45?"Placed":e<120?"Preparing":e<240?"Out for delivery":"Delivered"}
function orders(){
  if(!S.user)return '<h2>My orders</h2><p class="muted">Log in to see your orders and delivery details.</p><button class="btn" onclick="go(\'login\')">Login</button>';
  var l=S.orders.filter(function(o){return o.user===S.user.phone});
  if(!l.length)return '<h2>No orders yet</h2><p class="muted">Orders you place will show up here with live status and your delivery partner.</p><button class="btn" onclick="go(\'home\')">Open menu</button>';
  return '<h2>My orders</h2>'+l.map(function(o){var s=st(o),n=FLOW.indexOf(s);
    return '<div class="card" style="margin-bottom:12px"><div class="row sp"><b>'+o.id+'</b><span class="badge '+cls(s)+'">'+s+'</span></div><div class="muted">'+o.time+' · '+o.pay+(o.rest?' · '+esc(o.rest):'')+'</div>'+
    (s==="Cancelled"?'':'<div class="steps" aria-hidden="true">'+FLOW.map(function(x,i){return '<i class="'+(i<=n?"on":"")+'"></i>'}).join("")+'</div>')+
    '<div>'+o.items.map(function(i){return esc(i.n)+" × "+i.q}).join(", ")+'</div>'+
    (o.dp&&s!=="Cancelled"?'<div class="card" style="margin-top:10px"><b>🛵 Your delivery partner</b><div>'+o.dp.n+' · ⭐ '+o.dp.r+'</div><div class="muted">📞 '+o.dp.ph+' · Vehicle '+o.dp.v+'</div></div>':'')+
    '<div class="row sp" style="margin-top:8px"><span class="price">'+money(o.total)+'</span>'+(s==="Placed"?'<button class="btn bad" onclick="cancel(\''+o.id+'\')">Cancel order</button>':'')+'</div></div>'}).join("")}
function cancel(id){var o=S.orders.find(function(x){return x.id===id});if(o&&st(o)==="Placed"){o.status="Cancelled";sv("orders",S.orders);toast("Order cancelled");render()}}
function contact(){return '<div class="card" style="max-width:520px"><h2 style="margin-top:0">Contact us</h2><p class="muted">Questions about an order? Write to us and we’ll reply within a day. Support hours: '+HRS+'.</p><label for="cm">Message</label><textarea id="cm" rows="4"></textarea><p><button class="btn" onclick="if($(\'cm\').value.trim()){toast(\'Message sent\');go(\'home\')}else toast(\'Write a message first\')">Send message</button></p></div>'}
setInterval(function(){if(S.view==="orders")render()},5000);
render();
/* neon background + cursor effects */
(function(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var bg=$("fx"),cu=$("cur"),b=bg.getContext("2d"),c=cu.getContext("2d"),W,H,P=[],T=[],m={x:-99,y:-99},K=["#ff2a1a","#ff7a1a","#ffc21a","#ff4d00"];
function size(){W=bg.width=cu.width=innerWidth;H=bg.height=cu.height=innerHeight}
size();addEventListener("resize",size);
for(var i=0;i<0;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,c:K[i%4]});
addEventListener("pointermove",function(e){m.x=e.clientX;m.y=e.clientY;T.push({x:m.x,y:m.y,l:1,c:K[(Math.random()*4)|0],vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5})});
addEventListener("pointerdown",function(e){for(var i=0;i<18;i++){var a=Math.PI*2*i/18;T.push({x:e.clientX,y:e.clientY,l:1,c:K[i%4],vx:Math.cos(a)*3,vy:Math.sin(a)*3})}});
function tick(){b.clearRect(0,0,W,H);
for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
b.fillStyle=p.c;b.shadowBlur=12;b.shadowColor=p.c;b.beginPath();b.arc(p.x,p.y,2,0,6.3);b.fill();b.shadowBlur=0;
for(var j=i+1;j<P.length;j++){var q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){b.strokeStyle="rgba(155,92,255,"+(.35*(1-d/130))+")";b.beginPath();b.moveTo(p.x,p.y);b.lineTo(q.x,q.y);b.stroke()}}
var dm=Math.hypot(p.x-m.x,p.y-m.y);if(dm<160){b.strokeStyle="rgba(24,240,255,"+(.6*(1-dm/160))+")";b.beginPath();b.moveTo(p.x,p.y);b.lineTo(m.x,m.y);b.stroke()}}
c.clearRect(0,0,W,H);
for(i=T.length-1;i>=0;i--){var t=T[i];t.x+=t.vx;t.y+=t.vy;t.l-=.03;if(t.l<=0){T.splice(i,1);continue}c.globalAlpha=t.l;c.fillStyle=t.c;c.shadowBlur=14;c.shadowColor=t.c;c.beginPath();c.arc(t.x,t.y,3*t.l+1,0,6.3);c.fill()}
c.globalAlpha=1;c.strokeStyle="#ff7a1a";c.shadowBlur=14;c.shadowColor="#ff3a1a";c.lineWidth=2;c.beginPath();c.arc(m.x,m.y,14,0,6.3);c.stroke();
requestAnimationFrame(tick)}tick()})();
/* fire background */
(function(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var cv=$("fire"),x=cv.getContext("2d"),W,H,F=[];
function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight}sz();addEventListener("resize",sz);
function spawn(){var e=Math.random()<.1,l=e?100+Math.random()*100:55+Math.random()*45;F.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*(e?1.6:.8),vy:-(e?2+Math.random()*3:1.2+Math.random()*2.2),r:18+Math.random()*34,l:l,m:l,e:e})}
function loop(){x.globalCompositeOperation="source-over";x.clearRect(0,0,W,H);x.globalCompositeOperation="lighter";

for(var i=F.length-1;i>=0;i--){var f=F[i];f.x+=f.vx+Math.sin((f.y+i)*.02)*.5;f.y+=f.vy;f.l--;if(f.l<=0){F.splice(i,1);continue}

g.addColorStop(0,"rgba(255,"+(120+135*t|0)+",40,"+a+")");g.addColorStop(.5,"rgba(255,"+(60*t|0)+",0,"+a*.6+")");g.addColorStop(1,"rgba(120,0,0,0)");
